<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            max-width: 600px;
        }

        .card {
            background-color: #ffffff;
            border: none;
            border-radius: 10px;
        }

        h1 {
            font-family: 'Roboto', sans-serif;
            font-weight: 700;
        }

        .form-control {
            border-radius: 5px;
        }

        .btn-primary, .btn-secondary {
            border-radius: 5px;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #004085;
        }

        .btn-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
            border-color: #545b62;
        }

        .btn-block + .btn-block {
            margin-top: 10px;
        }

        .no-decoration {
            text-decoration: none !important;
            color: white !important;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .card {
                padding: 15px;
            }

            h1 {
                font-size: 28px;
                text-align: center;
            }

            .btn-block {
                width: 100%;
                margin-top: 10px;
            }

            .form-group {
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h1 class="title-center">Вход</h1>
        {% if message %}
        <div class="alert alert-{{ 'danger' if 'Неправильный' in message else 'success' }}" role="alert">
            {{ message }}
        </div>
        {% endif %}
        <form method="post">
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="text" class="form-control" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block mt-4">Войти</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary btn-block">Отменить</a>
        </form>
        <div class="text-center mt-3">
            <a href="{{ url_for('forgot_password') }}" class="no-decoration">Забыли пароль?</a>
        </div>
    </div>
</div>
</body>
</html>
