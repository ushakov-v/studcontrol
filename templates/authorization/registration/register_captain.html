<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация старосты</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            max-width: 600px;
        }

        .card {
            background-color: #ffffff;
            border: none;
            border-radius: 10px;
        }

        h1 {
            font-family: 'Roboto', sans-serif;
            font-weight: 700;
        }

        .form-control {
            border-radius: 5px;
        }

        .form-control::placeholder {
            color: #6c757d;
            font-style: italic;
        }

        .btn-primary, .btn-secondary {
            border-radius: 5px;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #004085;
        }

        .btn-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
            border-color: #545b62;
        }

        .btn-block + .btn-block {
            margin-top: 10px;
        }

        .tooltip-icon {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #6c757d;
            color: white;
            text-align: center;
            font-size: 14px;
            line-height: 20px;
            cursor: pointer;
            margin-left: 5px;
            position: relative;
        }

        .tooltip-icon:hover .tooltip-text {
            display: block;
        }

        .tooltip-text {
            display: none;
            width: 200px;
            background-color: #6c757d;
            color: white;
            text-align: center;
            border-radius: 5px;
            padding: 5px;
            position: absolute;
            z-index: 1;
            bottom: 125%; /* Позиционирование сверху */
            left: 50%;
            margin-left: -100px;
        }

        .tooltip-text::after {
            content: "";
            position: absolute;
            top: 100%; /* Снизу элемента tooltip */
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #6c757d transparent transparent transparent;
        }
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .card {
                padding: 15px;
            }

            .form-group {
                margin-bottom: 15px;
            }

            .btn-block {
                width: 100%;
            }

            .title-center {
                font-size: 28px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h1 class="title-center">Регистрация</h1>
        {% if message %}
        <div class="alert alert-{{ message_type }}" role="alert">
            {{ message }}
        </div>
        {% endif %}
        <form method="post">
            <div class="form-group">
                <label for="full_name">Ваше ФИО <span style="color: #6c757d;">(Пример: Иванов Иван Иванович)</span></label>
                <input type="text" class="form-control" id="full_name" name="full_name" value="{{ full_name or '' }}" required onblur="capitalizeName()">
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Подтвердите пароль</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
            </div>
            <div class="form-group">
                <label for="institute">Институт</label>
                <select class="form-control" id="institute" name="institute" required>
                    <option value="institute_1" {% if institute == 'institute_1' %}selected{% endif %}>ВТШ «СПИ». Факультет информационных технологий</option>
                    <option value="institute_2" {% if institute == 'institute_2' %}selected{% endif %}>ВТШ «СПИ». Инженерный факультет</option>
                    <option value="institute_3" {% if institute == 'institute_3' %}selected{% endif %}>Институт ядерной энергии и промышленности</option>
                    <option value="institute_4" {% if institute == 'institute_4' %}selected{% endif %}>Юридический институт</option>
                    <option value="institute_5" {% if institute == 'institute_5' %}selected{% endif %}>Морской институт</option>
                    <option value="institute_6" {% if institute == 'institute_6' %}selected{% endif %}>Институт радиоэлектроники и интеллектуальных технических систем</option>
                    <option value="institute_7" {% if institute == 'institute_7' %}selected{% endif %}>Институт финансов, экономики и управления</option>
                    <option value="institute_8" {% if institute == 'institute_8' %}selected{% endif %}>Политехнический институт</option>
                    <option value="institute_9" {% if institute == 'institute_9' %}selected{% endif %}>Институт общественных наук и международных отношений</option>
                    <option value="institute_10" {% if institute == 'institute_10' %}selected{% endif %}>Гуманитарно-педагогический институт</option>
                    <option value="institute_11" {% if institute == 'institute_11' %}selected{% endif %}>Институт фундаментальной медицины и здоровьесбережения</option>
                    <option value="institute_12" {% if institute == 'institute_12' %}selected{% endif %}>Институт развития города</option>
                    <option value="institute_13" {% if institute == 'institute_13' %}selected{% endif %}>Институт перспективных исследований</option>
                </select>
            </div>
            <div class="form-group">
                <label for="group">Учебная группа <span style="color: #6c757d;">(Пример: ИТ/б-20-1-о)</span></label>
                <input type="text" class="form-control" id="group" name="group" value="{{ group or '' }}" required>
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="start_date">Начало обучения</label>
                    <input type="date" class="form-control" id="start_date" name="start_date" value="{{ start_date or '' }}" required>
                </div>
                <div class="form-group col-md-6">
                    <label for="end_date">Конец обучения
                        <span class="tooltip-icon">?
                            <span class="tooltip-text">
                                Даты нужны для подсчёта количества семестров<br><br>
                                Пример для бакалавриата:<br>
                                01.09.2021 - 31.08.2025<br><br>
                                Пример для специалитета:<br>
                                01.09.2021 - 31.08.2026<br><br>
                                Пример для магистратуры:<br>
                                01.09.2021 - 31.08.2023
                            </span>
                        </span>
                    </label>
                    <input type="date" class="form-control" id="end_date" name="end_date" value="{{ end_date or '' }}" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary btn-block">Отменить</a>
        </form>
    </div>
</div>
<script>
    // Функция для форматирования ФИО
    function capitalizeName() {
        const nameField = document.getElementById('full_name');
        let nameValue = nameField.value.trim();

        // Разделяем на части по пробелам и дефисам, включая разделители в результат
        let parts = nameValue.split(/([-\s])/);

        // Применяем капитилизацию к каждой части, которая не является разделителем
        for (let i = 0; i < parts.length; i++) {
            if (parts[i] !== '-' && parts[i] !== ' ') {
                parts[i] = parts[i].charAt(0).toUpperCase() + parts[i].slice(1).toLowerCase();
            }
        }

        // Объединяем части обратно
        nameField.value = parts.join('');
    }
</script>
</body>
</html>
